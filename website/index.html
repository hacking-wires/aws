<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AWS Self-Healing — Actions</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>AWS Self-Healing Infrastructure</h1>
        <p class="sub">Recent auto-remediation actions</p>
    </header>

    <main>
        <div class="toolbar">
            <button id="refresh">Refresh</button>
            <span id="status" class="status">loading…</span>
        </div>

        <table id="actions">
            <thead>
                <tr>
                    <th>When (UTC)</th>
                    <th>Instance</th>
                    <th>Action</th>
                    <th>Outcome</th>
                    <th>Reason</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </main>

    <script src="config.js"></script>
    <script src="script.js"></script>
</body>
</html>
