name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax check
        run: python -m py_compile lambda-function.py
      - name: HTML/JS smoke
        run: |
          test -f website/index.html
          test -f website/script.js
          test -f website/style.css
